entity:
  name: FleetManager

  description: >
    Manages the fleet of tricycles and riders of a company on behalf of the fleet owner. Also, responsible for setting up assignments.

  properties:

    id:
      type: uuid
      unique: true

    status:
      type: FleetManagerStatus

  relationships:

    is:
      target: Person
      cardinality: one

    works_for:
      target: Company 
      cardinality: zero..one

    assigns:
      target: Assignment
      cardinality: many

    manages:
      target: Rider
      cardinality: many

    manages:
      target: Tricycle
      cardinality: many
