entity:
  name: Company

  description: >
    A business that manages tricycle fleets, owned by the fleet owner and managed by fleet manager on behalf of the fleet owner

  properties:

    id:
      type: uuid
      unique: true

    name:
      type: string
      constraint: [REGEX:/[a-zA-Z -)(]{2,}/]

    status:
      type: CompanyStatus
    
  relationships:

    property_of:
      target: FleetOwner
      cardinality: one

    managed_by:
      target: FleetManager
      cardinality: zero..one

    owns:
      target: Tricycle
      cardinality: many

    employer_of:
      target: Rider
      cardinality: many

    owns:
      target: Assignment
      cardinality: many

